# Atmosphere rewrite (see shaderpacks/serievx_atmosphere_plan.md):
# colortex12 = packed atmosphere LUT (T + MS + Sky-View) at 256×256
# colortex13 = cloud shadow map at 512×512
texture.colortex12.resolution=256 256
texture.colortex13.resolution=512 512
# Required for the dedicated 3D voxel image (image.voxelImg below). Without this
# Iris refuses to load: "Custom images are being used, but the feature flag ...".
iris.features.required = CUSTOM_IMAGES SSBO

# Cascaded voxel grid — ONE stacked 3D image holding all four cascades.
#
# Cascade k covers 2^k blocks per voxel and occupies y in [k*128, (k+1)*128) of
# the atlas, so the atlas is always 128*4 = 512 tall regardless of cascade size.
# Stacking beats four separate bindings: the shadow fragment stage writes every
# cascade in one pass and would otherwise burn four image uniforms of its 16.
#
# One R32UI word per voxel packs category + 10-bit shape id + RGB565 albedo
# (lib/pt/voxelFormat.glsl) — the same 4 bytes the old RGBA8UI grid used, but
# with room for the 761 model-derived shapes the BLAS needs.
#
# Format: <sampler> <pixelFmt> <internalFmt> <type> <clear> <mipmap> X Y Z.
# MUST stay in sync with VOXEL_CASCADE_SIZE in options.glsl and the constants in
# lib/pt/voxelCascade.glsl.
#if VOXEL_CASCADE_SIZE == 128
    #define VOX_XZ 128
    #define BRICK_XZ 16
    #define SUPER_XZ 2
#else
    #define VOX_XZ 256
    #define BRICK_XZ 32
    #define SUPER_XZ 4
#endif
image.voxelImg = voxelSampler RED_INTEGER R32UI UNSIGNED_INT true false VOX_XZ 512 VOX_XZ
# Hierarchical occupancy for the empty-space-skipping DDA, one set per cascade,
# stacked the same way (brick = cascade/8 -> 16*4 = 64 tall; super = cascade/64
# -> 2*4 = 8 tall). Written by the shadow pass alongside every voxel store.
image.brickImg = brickSampler RED_INTEGER R8UI UNSIGNED_BYTE true false BRICK_XZ 64 BRICK_XZ
image.superBrickImg = superBrickSampler RED_INTEGER R8UI UNSIGNED_BYTE true false SUPER_XZ 8 SUPER_XZ

# --- Surface cache ----------------------------------------------------------
# Per-voxel-face outgoing radiance over cascade 0, the store that decouples
# lighting from tracing (lib/pt/surfaceCache.glsl). Y is expanded x6 for the six
# face directions using the same "stack along Y" convention as the voxel atlas,
# so the height is 128*6 = 768 regardless of cascade size.
#
# clear MUST stay false: the cache is persistent across frames, and the
# radiosity pass feeds last frame's values back in to get multi-bounce. Clearing
# it would reset the bounce every frame and leave only direct light.
#
# Indexed toroidally (worldVoxel & (N-1)) so entries survive camera motion; the
# alpha channel carries a validity tag that makes a stale slot read as black
# instead of as the block N away.
image.faceRadianceImg = faceRadianceSampler RGBA RGBA16F FLOAT false false VOX_XZ 768 VOX_XZ

# Update-request volume: one byte per 8^3 brick of cascade 0, holding the low 8
# bits of the frame a ray last resolved through that brick. dg0_gather stamps it,
# sc1_surface_direct gates on it, so cache work tracks what the camera can see
# instead of the size of the volume. Lumen's LumenSurfaceCacheFeedback.
#
# Height is SC_Y/8 = 128/8 = 16 for every cascade size; XZ follows the brick
# dims. 32*16*32 = 16 KB, small enough to stay resident in L2, which is what
# makes both the stamp and the gate effectively free.
#
# clear MUST stay false: a stamp has to outlive the frame that wrote it, and
# SC_REQUEST_TTL is measured against it.
image.scRequestImg = scRequestSampler RED_INTEGER R8UI UNSIGNED_BYTE false false BRICK_XZ 16 BRICK_XZ

# --- Acceleration-structure buffers -----------------------------------------
# 0: static block-shape BLAS table (lookup + packed AABBs), uploaded once by the
#    setup pass from the generated lib/pt/shapeTable.glsl. 64 KB covers the
#    current 761 shapes / 3080 boxes with room to grow.
bufferObject.0 = 65536
# 1: per-frame entity acceleration structure — an atomic counter, captured
#    entity AABBs, and the LBVH nodes built over them in shadowcomp.
#    See lib/pt/entityBvh.glsl for the layout.
bufferObject.1 = 262144
# 2: special-blocklight emitter palette, 128 vec4 baked once by the setup pass
#    from lib/blocklightColors.glsl. Exists so the DDA can read an emitter's
#    colour with one indexed fetch instead of inlining a ~160-line branch tree
#    into the hottest loop in the renderer. See lib/pt/emitterPalette.glsl.
bufferObject.2 = 2048

# Setup programs run once at pack load; s0 fills the shape-table SSBO.
# setup  = s0_shape_table
#
# shadowcomp chain (runs after the shadow pass, so the voxel grid and the shadow
# map are both current):
#   shadowcomp  = sc0_entity_bvh       rebuilds the entity BVH
#   shadowcomp1 = sc1_surface_direct   surface cache: direct sun + self-emission
program.shadowcomp1.enabled = SURFACE_CACHE
# --- Deferred chain ----------------------------------------------------------
# Phase 1 of the Lumen rework deleted the whole screen-space lighting stack:
# the ReSTIR resolve + temporal accumulation, the SVGF a-trous chain, the
# history-fix prefilter, GTAO, and the screen-space reflection passes. The
# survivors were renumbered so the chain is contiguous again.
#
#   deferred  = dg0_gather    final gather: cosine rays resolved through the
#                             surface cache -> colortex8 GI, colortex15 the
#                             normal/depth reprojection key
#   deferred1 = d7_composite  scene lighting; reads colortex8 as `indirect`
#   deferred2 = d8_fog_sky
#   deferred3 = d9_vl         (gated by VOLUMETRIC_LIGHT)
#
# Phase 3.4 rebuilds reflections on the shared tracing stack.
program.deferred.enabled  = VOXEL_GI
program.deferred3.enabled = VOLUMETRIC_LIGHT

# Skip the cloud-shadow build pass when CLOUDS_SHADOW is off. d7's
# sampleCloudShadow() already short-circuits to 1.0 in that case, so the
# buffer is never read — prepare1 would just be a wasted dispatch.
program.prepare1.enabled = CLOUDS_SHADOW

# Cloud noise (offline-baked by shaderpacks/volume-noise-generator/).
# cloud_base   (128³ RGBA8): R=perlin-worley shape, G=worley erode mid, B=worley erode hi, A=coverage perlin
# cloud_detail ( 32³ RGBA8): R=curl, G=worley wisp, B=worley sharp wisp, A=boiling perlin
#
# customTexture.<name> binds globally across ALL stages — Iris's per-stage
# `texture.<stage>.<name>` form only accepts reserved sampler names
# (noisetex/colortex0..15/depthtex/shadowtex) or rebinds via .N suffix.
# Custom GLSL uniform names like cloudNoiseBase must use customTexture.
customTexture.cloudNoiseBase=noise/cloud_base.dat TEXTURE_3D RGBA8 128 128 128 RGBA UNSIGNED_BYTE
customTexture.cloudNoiseDetail=noise/cloud_detail.dat TEXTURE_3D RGBA8 32 32 32 RGBA UNSIGNED_BYTE
# Spatiotemporal blue noise (NVIDIA STBN, cosine hemisphere): 128x128 spatial tile x 64 temporal frames.
# RGB = cosine-weighted dir in the +Z hemisphere (decode *2-1); see stbnCosineHemisphere in lib/pt/sampling.glsl.
customTexture.blueNoise=noise/stbn_cosine.dat TEXTURE_3D RGBA8 128 128 64 RGBA UNSIGNED_BYTE

# Query LUT atlas. Bound only during composite stages;
# colortex6 is otherwise free for post-processing.
texture.composite.colortex6 = /lib/IMG/Luts2.png
