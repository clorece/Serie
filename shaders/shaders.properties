shadowFrustumCulling=false
shadow.culling=false
attribute.at_midBlock=at_midBlock
attribute.mc_midTexCoord=mc_midTexCoord

# Deferred gbuffer: entities/hand use a translucent render type, so vanilla leaves
# GL blending ON. With material packed into colortex1.a (0 = normal), the per-buffer
# src-alpha would blend the entity's normal/albedo with the background, making them
# render transparent and mis-lit. Force opaque writes; cutout is handled by discard.
blend.gbuffers_entities=off
blend.gbuffers_hand=off
blend.gbuffers_hand_water=off

# Water uses the deferred path (gbuffers_water -> composite c_water). Blending MUST be off: with
# blending on, the colortex1 wave-normal + water sentinel (a=1.0) gets alpha-blended away (same
# issue noted above for entities/hand), so c_water can't detect water. With blend off the program
# writes ONLY colortex1 (see DRAWBUFFERS:1 in world0/gbuffers_water.fsh); colortex0's lit scene is
# preserved simply by not being a render target, giving c_water an intact refraction background.
blend.gbuffers_water=off

screen=[Light] [Terrain] [Water] [Volumetric-Light] [Post-Processing] [Path-Tracing]
screen.columns=1

screen.Water=WATER_WAVES WATER_WAVE_OCTAVES WATER_WAVE_AMPLITUDE WATER_WAVE_SPEED WATER_NORMAL_STRENGTH WATER_NORMAL_FADE WATER_NORMAL_FADE_MIN WATER_REFRACTION WATER_REFRACTION_STRENGTH WATER_REFLECTIONS WATER_REFLECTION_STEPS WATER_SKYLIGHT_THRESHOLD <empty> WATER_FOG WATER_ABSORPTION_R WATER_ABSORPTION_G WATER_ABSORPTION_B WATER_SCATTER_R WATER_SCATTER_G WATER_SCATTER_B

