# Atmosphere rewrite (see shaderpacks/serievx_atmosphere_plan.md):
# colortex12 = packed atmosphere LUT (T + MS + Sky-View) at 256×256
# colortex13 = cloud shadow map at 512×512
texture.colortex12.resolution=256 256
texture.colortex13.resolution=512 512
# coarse voxel-occupancy pyramid (brick = 8³). Atlas for VOXEL_GRID_SIZE 256 is
# 256×128 (32³ coarse cells, 8 cols); 256×256 leaves headroom. Built by prepare2.
texture.colortex4.resolution=256 256

# Skip the d9_vl pass entirely when VL is disabled — avoids a full-screen
# read-modify-write on colortex0 just to no-op.
program.deferred11.enabled = VOLUMETRIC_LIGHT

# Skip the cloud-shadow build pass when CLOUDS_SHADOW is off. d7's
# sampleCloudShadow() already short-circuits to 1.0 in that case, so the
# buffer is never read — prepare1 would just be a wasted dispatch.
program.prepare1.enabled = CLOUDS_SHADOW

# Coarse voxel-occupancy build (brick-skipping DDA acceleration). Only needed
# when the path tracer / RTAO actually traverses the voxel atlas.
program.prepare2.enabled = VOXEL_GI

# Cloud noise (offline-baked by shaderpacks/volume-noise-generator/).
# cloud_base   (128³ RGBA8): R=perlin-worley shape, G=worley erode mid, B=worley erode hi, A=coverage perlin
# cloud_detail ( 32³ RGBA8): R=curl, G=worley wisp, B=worley sharp wisp, A=boiling perlin
#
# customTexture.<name> binds globally across ALL stages — Iris's per-stage
# `texture.<stage>.<name>` form only accepts reserved sampler names
# (noisetex/colortex0..15/depthtex/shadowtex) or rebinds via .N suffix.
# Custom GLSL uniform names like cloudNoiseBase must use customTexture.
# (See Alpha-Piscium for the canonical pattern.)
customTexture.cloudNoiseBase=noise/cloud_base.dat TEXTURE_3D RGBA8 128 128 128 RGBA UNSIGNED_BYTE
customTexture.cloudNoiseDetail=noise/cloud_detail.dat TEXTURE_3D RGBA8 32 32 32 RGBA UNSIGNED_BYTE
