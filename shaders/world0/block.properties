# SerieVX Block Properties (world0 override)
# block.10000 = Foliage (leaves + vines - voxelized as VOXEL_FOLIAGE for light blocking)
# block.10001 = Emissive (light sources - voxelized as VOXEL_EMISSIVE)
# block.10002 = Excluded from voxels (grass, flowers, small plants - too small for 1x1x1 voxels)

# Foliage: Leaves and vines that should block light as full voxels
block.10000=oak_leaves spruce_leaves birch_leaves jungle_leaves acacia_leaves dark_oak_leaves mangrove_leaves azalea_leaves flowering_azalea_leaves cherry_leaves pale_oak_leaves vine cobweb

# Emissive: Light sources
block.10001=torch wall_torch soul_torch soul_wall_torch glowstone sea_lantern shroomlight magma_block fire soul_fire campfire soul_campfire jack_o_lantern lantern soul_lantern end_rod beacon lava ochre_froglight verdant_froglight pearlescent_froglight glow_lichen redstone_lamp firefly_bush open_eyeblossom

# Excluded from voxels: Small non-block geometry (grass, flowers, saplings, crops)
# These use short_grass (1.20.3+), NOT "grass" which is grass_block
block.10002=short_grass tall_grass fern large_fern dead_bush dandelion poppy blue_orchid allium azure_bluet red_tulip orange_tulip white_tulip pink_tulip oxeye_daisy cornflower lily_of_the_valley wither_rose sunflower lilac rose_bush peony torchflower seagrass tall_seagrass sweet_berry_bush oak_sapling spruce_sapling birch_sapling jungle_sapling acacia_sapling dark_oak_sapling cherry_sapling pale_oak_sapling bamboo_sapling nether_sprouts warped_roots crimson_roots brown_mushroom red_mushroom sugar_cane kelp kelp_plant hanging_roots small_dripleaf big_dripleaf big_dripleaf_stem spore_blossom pink_petals pitcher_plant wildflowers short_dry_grass tall_dry_grass bush cactus_flower closed_eyeblossom

# Biome-tinted ground: blocks with green-tinted top + untinted dirt sides.
# Voxelization skips untinted faces so the stored color is always green.
block.10003=grass_block