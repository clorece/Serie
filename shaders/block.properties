# SerieVX Block Properties
# block.10000 = Foliage 2 (leaves - voxelized, soft NdotL)
# block.10001 = Emissive (light sources - voxelized as VOXEL_EMISSIVE)
# block.10002 = Excluded from voxels (slabs, stairs, fences, gates, etc. - no full block intersection)
# block.10005 = Foliage 1 (grass, flowers, crops, vines - excluded from voxels, soft NdotL)

# Foliage 2: Leaves and vines that should block light as full voxels but have soft shading
block.10000=leaves leaves2 oak_leaves spruce_leaves birch_leaves jungle_leaves acacia_leaves dark_oak_leaves azalea_leaves flowering_azalea_leaves mangrove_leaves cherry_leaves pale_oak_leaves cobweb

