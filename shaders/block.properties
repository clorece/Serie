# Biome-tinted ground: blocks with green-tinted top + untinted dirt sides.
# Voxelization skips untinted faces so the stored color is always green.
block.10003=grass_block

# Water: rendered through the deferred water path (gbuffers_water -> composite c_water).
# Kept out of the voxel grid (see shadow.glsl) so GI rays pass through it.
block.10006=water flowing_water

# Glass group (10004): colour tint + refraction + low opacity. Excluded from voxels (shadow.glsl).
block.10004=glass glass_pane tinted_glass slime_block honey_block beacon barrier light \
